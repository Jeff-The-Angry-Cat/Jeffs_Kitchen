<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="The argument in five steps: the pace, the strain, the design, the data, the whole. Each step leads to the next.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="900" height="190" fill="#FFFFFF"/>

  <defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
  <rect class="bw" x="10" y="35" width="160" height="120" rx="6"/>
  <text class="cap" x="24" y="60">Part 1</text>
  <text class="h" x="24" y="84">The pace</text>
  <text class="s" x="24" y="108">Business change and</text>
  <text class="s" x="24" y="124">attackers both speed up</text>

  <rect class="bx" x="195" y="35" width="160" height="120" rx="6"/>
  <text class="cap" x="209" y="60">Part 2</text>
  <text class="h" x="209" y="84">The strain</text>
  <text class="s" x="209" y="108">Silos slow the response</text>
  <text class="s" x="209" y="124">and wear people out</text>

  <rect class="bx" x="380" y="35" width="160" height="120" rx="6"/>
  <text class="cap" x="394" y="60">Part 3</text>
  <text class="h" x="394" y="84">The design</text>
  <text class="s" x="394" y="108">Service, architecture and</text>
  <text class="s" x="394" y="124">organisation as one Star</text>

  <rect class="ba" x="565" y="35" width="160" height="120" rx="6"/>
  <text class="cap" x="579" y="60">Part 4</text>
  <text class="h" x="579" y="84">The data</text>
  <text class="s" x="579" y="108">A common view,</text>
  <text class="s" x="579" y="124">not one big store</text>

  <rect class="ba" x="750" y="35" width="140" height="120" rx="6"/>
  <text class="cap" x="764" y="60">Part 5</text>
  <text class="h" x="764" y="84">The whole</text>
  <text class="s" x="764" y="108">One team, one picture,</text>
  <text class="s" x="764" y="124">within appetite</text>

  <line class="ln" x1="170" y1="95" x2="193" y2="95" marker-end="url(#m1)"/>
  <line class="ln" x1="355" y1="95" x2="378" y2="95" marker-end="url(#m1)"/>
  <line class="ln" x1="540" y1="95" x2="563" y2="95" marker-end="url(#m1)"/>
  <line class="ln" x1="725" y1="95" x2="748" y2="95" marker-end="url(#m1)"/>

</svg>
