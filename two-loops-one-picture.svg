<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Two loops share one picture and one intent" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="400" fill="#ffffff"/>
  <defs><marker id="om-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a85"/></marker></defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1d">Two loops share one picture and one intent</text>
  <rect x="24" y="56" width="712" height="56" rx="8" fill="#f0efec" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="380" y="80" text-anchor="middle" font-weight="600" fill="#1f1f1d">Business intent, set by the risk owner</text>
  <text x="380" y="98" text-anchor="middle" font-size="11.5" fill="#5f5f5a">Risk appetite, impact tolerances, critical services</text>
  <g fill="none" stroke="#8a8a85" stroke-width="1.25">
    <path d="M127 112V160" marker-end="url(#om-arrow)"/><path d="M380 112V160" marker-end="url(#om-arrow)"/><path d="M633 112V160" marker-end="url(#om-arrow)"/>
    <path d="M230 212H270" marker-start="url(#om-arrow)" marker-end="url(#om-arrow)"/><path d="M490 212H530" marker-start="url(#om-arrow)" marker-end="url(#om-arrow)"/>
    <path d="M350 320V264" marker-end="url(#om-arrow)"/><path d="M410 264V320" marker-end="url(#om-arrow)"/>
    <path d="M127 264V320" marker-end="url(#om-arrow)"/><path d="M633 264V320" marker-end="url(#om-arrow)"/>
  </g>
  <text x="390" y="140" font-size="11.5" fill="#5f5f5a">sets the requirement (Task)</text>
  <rect x="24" y="160" width="206" height="104" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="127" y="184" text-anchor="middle" font-weight="600" fill="#1f1f1d">Exposure loop (CTEM)</text>
  <text x="127" y="204" text-anchor="middle" font-size="11.5" fill="#1f1f1d">Scope, discover, prioritise,</text>
  <text x="127" y="220" text-anchor="middle" font-size="11.5" fill="#1f1f1d">validate, mobilise</text>
  <text x="127" y="244" text-anchor="middle" font-size="11.5" fill="#5f5f5a">Before an attack, always on</text>
  <rect x="270" y="160" width="220" height="104" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
  <text x="380" y="184" text-anchor="middle" font-weight="600" fill="#1f1f1d">Common security picture</text>
  <text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#1f1f1d">Analytics, identity, policy,</text>
  <text x="380" y="220" text-anchor="middle" font-size="11.5" fill="#1f1f1d">dashboards (CSMA layers)</text>
  <text x="380" y="244" text-anchor="middle" font-size="11.5" fill="#5f5f5a">One orientation for all</text>
  <rect x="530" y="160" width="206" height="104" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="633" y="184" text-anchor="middle" font-weight="600" fill="#1f1f1d">Response loop (OODA)</text>
  <text x="633" y="204" text-anchor="middle" font-size="11.5" fill="#1f1f1d">Observe, orient, decide, act</text>
  <text x="633" y="220" text-anchor="middle" font-size="11.5" fill="#1f1f1d">detect, contain, recover</text>
  <text x="633" y="244" text-anchor="middle" font-size="11.5" fill="#5f5f5a">During an attack, in minutes</text>
  <text x="119" y="296" text-anchor="end" font-size="11.5" fill="#5f5f5a">mobilise fixes</text>
  <text x="342" y="296" text-anchor="end" font-size="11.5" fill="#5f5f5a">signals in</text>
  <text x="418" y="296" font-size="11.5" fill="#5f5f5a">actions out</text>
  <text x="625" y="296" text-anchor="end" font-size="11.5" fill="#5f5f5a">contain, recover</text>
  <rect x="24" y="320" width="712" height="56" rx="8" fill="none" stroke="#8a8a85" stroke-width="1.25"/>
  <text x="380" y="344" text-anchor="middle" font-weight="600" fill="#1f1f1d">One team: security, technology, business, suppliers, staff</text>
  <text x="380" y="362" text-anchor="middle" font-size="11.5" fill="#5f5f5a">Every contributor is both a sensor and an actor</text>
</svg>
