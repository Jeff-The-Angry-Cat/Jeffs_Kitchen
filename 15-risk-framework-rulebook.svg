<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="The board's risk appetite flows into the enterprise risk framework, which runs vertically through four layers. At the operating model it decides which risks each part owns. In organisation design it fixes that the business owns risk and controls while security provides and challenges. In service design it defines the user's need to meet control obligations with least friction. In enterprise architecture it requires traceability from risk to service.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="860" height="380" fill="#FFFFFF"/>

  <defs><marker id="m15" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker></defs>
  <rect class="bw" x="215" y="12" width="180" height="38" rx="4"/><text class="b m tw" x="305" y="36">Board's risk appetite</text>
  <line class="lw" x1="305" y1="50" x2="305" y2="72" marker-end="url(#m15)"/>
  <rect class="bx" x="20" y="90" width="820" height="60" rx="4"/>
  <rect class="bx" x="20" y="160" width="820" height="60" rx="4"/>
  <rect class="bx" x="20" y="230" width="820" height="60" rx="4"/>
  <rect class="bx" x="20" y="300" width="820" height="60" rx="4"/>
  <text class="b" x="36" y="116">Operating model</text><text class="s" x="36" y="134">where work sits</text>
  <text class="b" x="36" y="186">Organisation design</text><text class="s" x="36" y="204">who does what</text>
  <text class="b" x="36" y="256">Service design</text><text class="s" x="36" y="274">what the user needs</text>
  <text class="b" x="36" y="326">Enterprise architecture</text><text class="s" x="36" y="344">what it runs on</text>
  <rect class="bw" x="280" y="74" width="50" height="296" rx="4"/>
  <text class="b tw m" transform="translate(310 222) rotate(-90)">Enterprise risk framework</text>
  <text x="350" y="125">Decides which risks each part of the firm owns</text>
  <text x="350" y="195">The business owns risk and controls; security provides and challenges</text>
  <text x="350" y="265">The user's need: meet control obligations with the least friction</text>
  <text x="350" y="335">Traceability from each risk to its control, system and service</text>

</svg>
