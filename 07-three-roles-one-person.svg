<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="Three roles held by one person: CISO, service provider and head of department. Between each pair is a tension: the CISO assures the provider's own services; policy can bend to the department's budget; service quality competes with cost.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="760" height="370" fill="#FFFFFF"/>

  <rect class="bx" x="270" y="20" width="220" height="70" rx="6"/>
  <text class="h m" x="380" y="46">CISO</text>
  <text class="s m" x="380" y="64">sets policy and assures it</text>
  <text class="s m" x="380" y="80">second line: oversight</text>
  <rect class="bx" x="30" y="270" width="220" height="70" rx="6"/>
  <text class="h m" x="140" y="296">Service provider</text>
  <text class="s m" x="140" y="314">runs services for the business</text>
  <text class="s m" x="140" y="330">first line: a service</text>
  <rect class="bx" x="510" y="270" width="220" height="70" rx="6"/>
  <text class="h m" x="620" y="296">Head of department</text>
  <text class="s m" x="620" y="314">invests, resources, runs</text>
  <text class="s m" x="620" y="330">first line: its own risks</text>
  <circle class="ba" cx="380" cy="200" r="48"/>
  <text class="b m ta" x="380" y="196">One</text>
  <text class="b m ta" x="380" y="213">person</text>
  <line class="lm" x1="380" y1="90" x2="380" y2="152"/>
  <line class="lm" x1="250" y1="285" x2="340" y2="228"/>
  <line class="lm" x1="510" y1="285" x2="420" y2="228"/>
  <line class="lw dash" x1="270" y1="70" x2="120" y2="268"/>
  <line class="lw dash" x1="490" y1="70" x2="640" y2="268"/>
  <line class="lw dash" x1="250" y1="320" x2="510" y2="320"/>
  <text class="tw e" x="180" y="150">assures its</text>
  <text class="tw e" x="180" y="166">own services</text>
  <text class="tw" x="580" y="150">policy can bend</text>
  <text class="tw" x="580" y="166">to the budget</text>
  <text class="tw m" x="380" y="310">quality against cost</text>

</svg>
