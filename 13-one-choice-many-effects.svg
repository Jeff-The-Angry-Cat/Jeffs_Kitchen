<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="One choice, organising around missions such as protecting payments, ripples to eight places: strategy, structure, processes, people, service design, rewards, enterprise architecture and measures.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>

  <defs><marker id="m13" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker></defs>
  <rect class="ba" x="320" y="180" width="260" height="72" rx="6"/>
  <text class="cap m" x="450" y="202">One choice</text>
  <text class="b m ta" x="450" y="222">Organise around missions,</text>
  <text class="b m ta" x="450" y="240">such as "protect payments"</text>

  <rect class="bx" x="10" y="20" width="250" height="58" rx="5"/><text class="b" x="22" y="43">Strategy</text><text class="s" x="22" y="63">Missions trace to business intent</text>
  <rect class="bx" x="325" y="20" width="250" height="58" rx="5"/><text class="b" x="337" y="43">Structure</text><text class="s" x="337" y="63">Mission teams with clear authority</text>
  <rect class="bx" x="640" y="20" width="250" height="58" rx="5"/><text class="b" x="652" y="43">Processes</text><text class="s" x="652" y="63">Signals routed to the mission team</text>
  <rect class="bx" x="10" y="187" width="250" height="58" rx="5"/><text class="b" x="22" y="210">People</text><text class="s" x="22" y="230">Broader skills, more judgement</text>
  <rect class="bx" x="640" y="187" width="250" height="58" rx="5"/><text class="b" x="652" y="210">Service design</text><text class="s" x="652" y="230">A named owner for each service</text>
  <rect class="bx" x="10" y="354" width="250" height="58" rx="5"/><text class="b" x="22" y="377">Rewards</text><text class="s" x="22" y="397">Credit for outcomes, not tickets</text>
  <rect class="bx" x="325" y="354" width="250" height="58" rx="5"/><text class="b" x="337" y="377">Enterprise architecture</text><text class="s" x="337" y="397">Data and tools shared by missions</text>
  <rect class="bx" x="640" y="354" width="250" height="58" rx="5"/><text class="b" x="652" y="377">Measures</text><text class="s" x="652" y="397">Time each service stays in appetite</text>

  <line class="la" x1="350" y1="180" x2="210" y2="82" marker-end="url(#m13)"/>
  <line class="la" x1="450" y1="180" x2="450" y2="82" marker-end="url(#m13)"/>
  <line class="la" x1="550" y1="180" x2="690" y2="82" marker-end="url(#m13)"/>
  <line class="la" x1="320" y1="216" x2="264" y2="216" marker-end="url(#m13)"/>
  <line class="la" x1="580" y1="216" x2="636" y2="216" marker-end="url(#m13)"/>
  <line class="la" x1="350" y1="252" x2="210" y2="350" marker-end="url(#m13)"/>
  <line class="la" x1="450" y1="252" x2="450" y2="350" marker-end="url(#m13)"/>
  <line class="la" x1="550" y1="252" x2="690" y2="350" marker-end="url(#m13)"/>

