<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Business demand pushes from one side and threat activity from the other, with regulators' reporting clocks above. All three land on one security department with fixed people, budget and hours.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="900" height="330" fill="#FFFFFF"/>

  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="m2w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker>
  </defs>
  <text class="h" x="20" y="34">Business demand</text>
  <rect class="bx" x="20" y="50" width="270" height="34" rx="4"/><text x="32" y="72">More digital services, released faster</text>
  <rect class="bx" x="20" y="94" width="270" height="34" rx="4"/><text x="32" y="116">Cloud platforms and many more suppliers</text>
  <rect class="bx" x="20" y="138" width="270" height="34" rx="4"/><text x="32" y="160">AI built into products and daily work</text>
  <rect class="bx" x="20" y="182" width="270" height="34" rx="4"/><text x="32" y="204">Data shared with partners and customers</text>
  <rect class="bx" x="20" y="226" width="270" height="34" rx="4"/><text x="32" y="248">Customers expect it always to work</text>

  <text class="h e" x="880" y="34">Threat activity</text>
  <rect class="bw" x="610" y="50" width="270" height="34" rx="4"/><text x="622" y="72">Weaknesses exploited within days</text>
  <rect class="bw" x="610" y="94" width="270" height="34" rx="4"/><text x="622" y="116">Intruders spread in under an hour</text>
  <rect class="bw" x="610" y="138" width="270" height="34" rx="4"/><text x="622" y="160">AI-written phishing and faked voices</text>
  <rect class="bw" x="610" y="182" width="270" height="34" rx="4"/><text x="622" y="204">Extortion run as an industry</text>
  <rect class="bw" x="610" y="226" width="270" height="34" rx="4"/><text x="622" y="248">Attacks that arrive through suppliers</text>

  <rect class="bx" x="340" y="20" width="220" height="44" rx="4"/>
  <text class="b m" x="450" y="40">Regulators</text>
  <text class="s m" x="450" y="56">reporting clocks set in hours</text>
  <line class="ln" x1="450" y1="64" x2="450" y2="128" marker-end="url(#m2)"/>

  <rect class="ba" x="360" y="130" width="180" height="96" rx="6"/>
  <text class="h m" x="450" y="158">Security department</text>
  <text class="s m" x="450" y="182">the same people, budget</text>
  <text class="s m" x="450" y="198">and hours in the day</text>

  <line class="lm" x1="290" y1="67" x2="358" y2="150" marker-end="url(#m2)"/>
  <line class="lm" x1="290" y1="111" x2="358" y2="162" marker-end="url(#m2)"/>
  <line class="lm" x1="290" y1="155" x2="358" y2="175" marker-end="url(#m2)"/>
  <line class="lm" x1="290" y1="199" x2="358" y2="188" marker-end="url(#m2)"/>
  <line class="lm" x1="290" y1="243" x2="358" y2="202" marker-end="url(#m2)"/>

  <line class="lw" x1="610" y1="67" x2="542" y2="150" marker-end="url(#m2w)"/>
  <line class="lw" x1="610" y1="111" x2="542" y2="162" marker-end="url(#m2w)"/>
  <line class="lw" x1="610" y1="155" x2="542" y2="175" marker-end="url(#m2w)"/>
  <line class="lw" x1="610" y1="199" x2="542" y2="188" marker-end="url(#m2w)"/>
  <line class="lw" x1="610" y1="243" x2="542" y2="202" marker-end="url(#m2w)"/>

  <text class="m s" x="450" y="300">Both pressures grow each year. The capacity in the middle does not.</text>

</svg>
