<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Strategy and risk appetite at the top feed an operating model co-authored by all three disciplines. Below it are three layers: frontstage, led by service design; backstage, led by organisation design; and support, led by enterprise architecture. A single service cuts vertically through all three layers.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="820" height="400" fill="#FFFFFF"/>

  <defs><marker id="m9" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
  <rect class="bx" x="20" y="16" width="780" height="44" rx="4"/>
  <text class="b m" x="410" y="43">Strategy and risk appetite, set by the business</text>
  <line class="ln" x1="410" y1="60" x2="410" y2="82" marker-end="url(#m9)"/>
  <rect class="ba" x="20" y="84" width="780" height="48" rx="4"/>
  <text class="b m ta" x="410" y="104">Operating model</text>
  <text class="s m" x="410" y="122">written by all three disciplines together; owned by business operations</text>
  <rect class="bx" x="20" y="150" width="780" height="60" rx="4"/>
  <text class="b" x="40" y="176">Frontstage</text><text class="s" x="40" y="194">what the user meets: journeys and touchpoints</text>
  <text class="b ta e" x="780" y="185">Service design</text>
  <rect class="bx" x="20" y="220" width="780" height="60" rx="4"/>
  <text class="b" x="40" y="246">Backstage</text><text class="s" x="40" y="264">teams, roles, hand-offs and decision rights</text>
  <text class="b ta e" x="780" y="255">Organisation design</text>
  <rect class="bx" x="20" y="290" width="780" height="60" rx="4"/>
  <text class="b" x="40" y="316">Support</text><text class="s" x="40" y="334">processes, data, systems and platforms</text>
  <text class="b ta e" x="780" y="325">Enterprise architecture</text>
  <rect class="la dash" x="470" y="140" width="64" height="220" rx="4"/>
  <text class="s m ta" x="502" y="380">one service cuts through every layer</text>

</svg>
