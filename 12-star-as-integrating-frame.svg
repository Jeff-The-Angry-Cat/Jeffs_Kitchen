<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-label="Galbraith's Star with information and data at the centre as the sixth point. Strategy is set with the business and shared by all three disciplines. Structure: organisation design leads and architecture mirrors it. Processes: service design maps journeys and architecture maps value streams. Rewards and people: organisation design leads. Architecture leads the centre.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="780" height="440" fill="#FFFFFF"/>

  <polygon class="ln" points="390,85 527.9,185.2 475.2,347.3 304.8,347.3 252.1,185.2"/>
  <line class="la" x1="390" y1="230" x2="390" y2="85"/>
  <line class="la" x1="390" y1="230" x2="527.9" y2="185.2"/>
  <line class="la" x1="390" y1="230" x2="475.2" y2="347.3"/>
  <line class="la" x1="390" y1="230" x2="304.8" y2="347.3"/>
  <line class="la" x1="390" y1="230" x2="252.1" y2="185.2"/>
  <circle class="ba" cx="390" cy="230" r="48"/>
  <text class="s b m ta" x="390" y="222">Information</text>
  <text class="s b m ta" x="390" y="237">and data</text>
  <text class="s m" x="390" y="252">sixth point</text>
  <circle class="bx" cx="390" cy="85" r="38"/><text class="b m" x="390" y="90">Strategy</text>
  <circle class="bx" cx="527.9" cy="185.2" r="38"/><text class="b m" x="527.9" y="190">Structure</text>
  <circle class="bx" cx="475.2" cy="347.3" r="38"/><text class="b m" x="475.2" y="352">Processes</text>
  <circle class="bx" cx="304.8" cy="347.3" r="38"/><text class="b m" x="304.8" y="352">Rewards</text>
  <circle class="bx" cx="252.1" cy="185.2" r="38"/><text class="b m" x="252.1" y="190">People</text>
  <text x="440" y="66">Set with the business;</text>
  <text class="s" x="440" y="82">all three disciplines share it</text>
  <text x="578" y="181">Organisation design leads;</text>
  <text class="s" x="578" y="197">architecture mirrors it</text>
  <text x="522" y="345">Service design: journeys;</text>
  <text class="s" x="522" y="361">architecture: value streams</text>
  <text class="e" x="258" y="345">Organisation design leads;</text>
  <text class="s e" x="258" y="361">architecture is silent here</text>
