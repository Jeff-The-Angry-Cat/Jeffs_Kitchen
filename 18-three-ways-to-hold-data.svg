<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Three ways to hold security data. Keep it in each team: quick to start, but nobody sees the whole. Pour it into one central store: slow and costly, and still needs shared meaning. Share meaning and access: data stays where it is, but definitions and access are shared and a common view reads across it. The third is recommended.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="900" height="300" fill="#FFFFFF"/>

  <defs><marker id="m18" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker></defs>
  <text class="h" x="10" y="24">Keep it in each team</text>
  <rect class="bg" x="10" y="38" width="280" height="190" rx="6"/>
  <rect class="bx" x="28" y="110" width="40" height="32" rx="3"/><text class="s m" x="48" y="130">ID</text>
  <rect class="bx" x="80" y="96" width="40" height="32" rx="3"/><text class="s m" x="100" y="116">Net</text>
  <rect class="bx" x="132" y="124" width="40" height="32" rx="3"/><text class="s m" x="152" y="144">Cloud</text>
  <rect class="bx" x="184" y="100" width="40" height="32" rx="3"/><text class="s m" x="204" y="120">SOC</text>
  <rect class="bx" x="236" y="118" width="40" height="32" rx="3"/><text class="s m" x="256" y="138">Vuln</text>
  <text class="s tw" x="10" y="252">Quick to start; each team's terms.</text>
  <text class="s tw" x="10" y="268">Nobody sees the whole.</text>

  <text class="h" x="310" y="24">Pour it into one store</text>
  <rect class="bg" x="310" y="38" width="280" height="190" rx="6"/>
  <rect class="bx" x="328" y="56" width="40" height="32" rx="3"/><text class="s m" x="348" y="76">ID</text>
  <rect class="bx" x="380" y="56" width="40" height="32" rx="3"/><text class="s m" x="400" y="76">Net</text>
  <rect class="bx" x="432" y="56" width="40" height="32" rx="3"/><text class="s m" x="452" y="76">Cloud</text>
  <rect class="bx" x="484" y="56" width="40" height="32" rx="3"/><text class="s m" x="504" y="76">SOC</text>
  <rect class="bx" x="536" y="56" width="40" height="32" rx="3"/><text class="s m" x="556" y="76">Vuln</text>
  <line class="lm" x1="348" y1="88" x2="400" y2="148" marker-end="url(#m18)"/>
  <line class="lm" x1="400" y1="88" x2="425" y2="148" marker-end="url(#m18)"/>
  <line class="lm" x1="452" y1="88" x2="452" y2="148" marker-end="url(#m18)"/>
  <line class="lm" x1="504" y1="88" x2="479" y2="148" marker-end="url(#m18)"/>
  <line class="lm" x1="556" y1="88" x2="504" y2="148" marker-end="url(#m18)"/>
  <rect class="bx" x="352" y="150" width="200" height="52" rx="6"/>
  <text class="b m" x="452" y="173">One central store</text>
  <text class="s m" x="452" y="190">copied, then cleaned</text>
  <text class="s tw" x="310" y="252">Slow and costly to build.</text>
  <text class="s tw" x="310" y="268">Still needs shared meaning to be useful.</text>

  <text class="h ta" x="610" y="24">Share meaning and access</text>
  <rect class="ba" x="610" y="38" width="280" height="190" rx="6"/>
  <rect class="bx" x="660" y="52" width="180" height="34" rx="4"/>
  <text class="b m ta" x="750" y="74">Common view</text>
  <rect class="bx" x="628" y="124" width="40" height="32" rx="3"/><text class="s m" x="648" y="144">ID</text>
  <rect class="bx" x="680" y="124" width="40" height="32" rx="3"/><text class="s m" x="700" y="144">Net</text>
  <rect class="bx" x="732" y="124" width="40" height="32" rx="3"/><text class="s m" x="752" y="144">Cloud</text>
  <rect class="bx" x="784" y="124" width="40" height="32" rx="3"/><text class="s m" x="804" y="144">SOC</text>
  <rect class="bx" x="836" y="124" width="40" height="32" rx="3"/><text class="s m" x="856" y="144">Vuln</text>
  <line class="lm" x1="648" y1="124" x2="690" y2="86"/>
  <line class="lm" x1="700" y1="124" x2="720" y2="86"/>
  <line class="lm" x1="752" y1="124" x2="750" y2="86"/>
  <line class="lm" x1="804" y1="124" x2="780" y2="86"/>
  <line class="lm" x1="856" y1="124" x2="810" y2="86"/>
  <line class="la" x1="648" y1="156" x2="648" y2="176"/>
  <line class="la" x1="700" y1="156" x2="700" y2="176"/>
  <line class="la" x1="752" y1="156" x2="752" y2="176"/>
  <line class="la" x1="804" y1="156" x2="804" y2="176"/>
  <line class="la" x1="856" y1="156" x2="856" y2="176"/>
  <rect class="bx" x="624" y="176" width="256" height="40" rx="4"/>
  <text class="s b m ta" x="752" y="192">shared definitions, identity,</text>
  <text class="s b m ta" x="752" y="208">critical questions, access rules</text>
  <text class="s ta" x="610" y="252">Data stays where it is.</text>
  <text class="s ta" x="610" y="268">Meaning and access are shared.</text>

</svg>
