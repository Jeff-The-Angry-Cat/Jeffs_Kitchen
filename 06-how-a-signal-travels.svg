<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" role="img" aria-label="Left: in separate teams, a warning seen by monitoring climbs to its lead, to the head of security, down to the identity lead and then to the identity team: four hand-offs. Right: with one shared picture, monitoring adds the signal to the picture and the identity team acts on it directly: two steps, with the decision-maker told only if a critical question is answered.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="900" height="386" fill="#FFFFFF"/>

  <defs>
    <marker id="m6w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkw"/></marker>
    <marker id="m6a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker>
    <marker id="m6" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkm"/></marker>
  </defs>
  <text class="h" x="20" y="24">Today: the signal climbs and crosses</text>
  <rect class="bx" x="140" y="40" width="170" height="36" rx="4"/><text class="b m" x="225" y="63">Head of security</text>
  <g>
    <rect class="bg" x="20" y="100" width="76" height="200" rx="4"/>
    <rect class="bg" x="102" y="100" width="76" height="200" rx="4"/>
    <rect class="bg" x="184" y="100" width="76" height="200" rx="4"/>
    <rect class="bg" x="266" y="100" width="76" height="200" rx="4"/>
    <rect class="bg" x="348" y="100" width="76" height="200" rx="4"/>
    <text class="s b m" x="58" y="318">Identity</text>
    <text class="s b m" x="140" y="318">Network</text>
    <text class="s b m" x="222" y="318">Cloud</text>
    <text class="s b m" x="304" y="318">Monitoring</text>
    <text class="s b m" x="386" y="318">Policy</text>
    <rect class="bx" x="30" y="136" width="56" height="24" rx="3"/><text class="s m" x="58" y="152">lead</text>
    <rect class="bx" x="112" y="136" width="56" height="24" rx="3"/><text class="s m" x="140" y="152">lead</text>
    <rect class="bx" x="194" y="136" width="56" height="24" rx="3"/><text class="s m" x="222" y="152">lead</text>
    <rect class="bx" x="276" y="136" width="56" height="24" rx="3"/><text class="s m" x="304" y="152">lead</text>
    <rect class="bx" x="358" y="136" width="56" height="24" rx="3"/><text class="s m" x="386" y="152">lead</text>
    <rect class="bx" x="30" y="256" width="56" height="30" rx="3"/><text class="s m" x="58" y="275">team</text>
    <rect class="bx" x="112" y="256" width="56" height="30" rx="3"/><text class="s m" x="140" y="275">team</text>
    <rect class="bx" x="194" y="256" width="56" height="30" rx="3"/><text class="s m" x="222" y="275">team</text>
    <rect class="bx" x="276" y="256" width="56" height="30" rx="3"/><text class="s m" x="304" y="275">team</text>
    <rect class="bx" x="358" y="256" width="56" height="30" rx="3"/><text class="s m" x="386" y="275">team</text>
  </g>
  <polyline class="lw" points="304,256 304,164 268,80" marker-end="url(#m6w)"/>
  <polyline class="lw" points="182,78 60,134" marker-end="url(#m6w)"/>
  <line class="lw" x1="58" y1="162" x2="58" y2="252" marker-end="url(#m6w)"/>
  <circle class="bw" cx="304" cy="212" r="10"/><text class="s b m tw" x="304" y="216">1</text>
  <circle class="bw" cx="280" cy="108" r="10"/><text class="s b m tw" x="280" y="112">2</text>
  <circle class="bw" cx="121" cy="106" r="10"/><text class="s b m tw" x="121" y="110">3</text>
  <circle class="bw" cx="58" cy="206" r="10"/><text class="s b m tw" x="58" y="210">4</text>
  <text class="s m tw" x="304" y="334">seen here</text>
  <text class="s m tw" x="58" y="334">acted on here</text>
  <text class="s" x="20" y="360">Four hand-offs, each one a queue.</text>
  <text class="s" x="20" y="376">Each lead sees only their own slice.</text>

  <line class="lm" x1="450" y1="20" x2="450" y2="380"/>

  <text class="h" x="470" y="24">One team: the signal meets a shared picture</text>
  <rect class="bx" x="595" y="40" width="170" height="36" rx="4"/><text class="b m" x="680" y="63">Decision-maker</text>
  <rect class="ba" x="560" y="150" width="240" height="56" rx="6"/>
  <text class="b m ta" x="680" y="173">Common picture</text>
  <text class="s m" x="680" y="192">everyone feeds it, everyone sees it</text>
  <line class="lm" x1="515" y1="268" x2="590" y2="208"/>
  <line class="lm" x1="597" y1="268" x2="635" y2="208"/>
  <line class="lm" x1="679" y1="268" x2="680" y2="208"/>
  <line class="lm" x1="761" y1="268" x2="725" y2="208"/>
  <line class="lm" x1="843" y1="268" x2="770" y2="208"/>
  <rect class="bx" x="478" y="270" width="74" height="34" rx="4"/><text class="s b m" x="515" y="291">Identity</text>
  <rect class="bx" x="560" y="270" width="74" height="34" rx="4"/><text class="s b m" x="597" y="291">Network</text>
  <rect class="bx" x="642" y="270" width="74" height="34" rx="4"/><text class="s b m" x="679" y="291">Cloud</text>
  <rect class="bx" x="724" y="270" width="74" height="34" rx="4"/><text class="s b m" x="761" y="291">Monitoring</text>
  <rect class="bx" x="806" y="270" width="74" height="34" rx="4"/><text class="s b m" x="843" y="291">Policy</text>
  <line class="la" x1="761" y1="268" x2="728" y2="212" marker-end="url(#m6a)"/>
  <line class="la" x1="588" y1="208" x2="519" y2="264" marker-end="url(#m6a)"/>
  <circle class="ba" cx="756" cy="238" r="10"/><text class="s b m ta" x="756" y="242">1</text>
  <circle class="ba" cx="540" cy="238" r="10"/><text class="s b m ta" x="540" y="242">2</text>
  <line class="lm dash" x1="680" y1="148" x2="680" y2="80" marker-end="url(#m6)"/>
  <text class="s" x="690" y="110">only if it answers</text>
  <text class="s" x="690" y="125">a critical question</text>
  <text class="s" x="470" y="360">Two steps. The identity team acts within its own authority.</text>
  <text class="s" x="470" y="376">The leader hears only what they must.</text>

</svg>
