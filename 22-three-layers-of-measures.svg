<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Three layers of measures. Mission: are the services we protect staying within appetite, read by the board and business owners. Spine, which is new: is critical information reaching the right person in time, read by the head of security and business owners. Activity: is each team doing its work well, read by team leads.">
<style>
text{fill:#17212B;font-size:13px;font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif}
.s{font-size:11.5px;fill:#56616B} .b{font-weight:600} .h{font-size:14.5px;font-weight:600}
.m{text-anchor:middle} .e{text-anchor:end} .ta{fill:#0A5550} .tw{fill:#8A3F06}
.cap{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;fill:#56616B;font-weight:600}
.bx{fill:#FFFFFF;stroke:#8F9A97;stroke-width:1.2} .bg{fill:#F4F6F3;stroke:#D8DDD8;stroke-width:1}
.ba{fill:#DDEFEC;stroke:#0E6B66;stroke-width:1.6} .bw{fill:#FBEADB;stroke:#B4540A;stroke-width:1.6}
.bd{fill:none;stroke:#8F9A97;stroke-width:1.2;stroke-dasharray:5 4}
.ln{stroke:#17212B;stroke-width:1.4;fill:none} .lm{stroke:#8F9A97;stroke-width:1.2;fill:none}
.la{stroke:#0E6B66;stroke-width:2.2;fill:none} .lw{stroke:#B4540A;stroke-width:2.2;fill:none}
.dash{stroke-dasharray:6 5} .mk{fill:#17212B} .mka{fill:#0E6B66} .mkw{fill:#B4540A} .mkm{fill:#8F9A97}
.fa{fill:#DDEFEC} .fw{fill:#FBEADB} .dot{fill:#B4540A} .dota{fill:#0E6B66}
</style>
<rect x="0" y="0" width="820" height="300" fill="#FFFFFF"/>

  <rect class="bx" x="20" y="20" width="780" height="76" rx="5"/>
  <text class="cap" x="40" y="42">Mission</text>
  <text class="b" x="40" y="62">Are the services we protect staying within appetite?</text>
  <text class="s" x="40" y="82">time each critical service spent outside appetite or tolerance; losses against appetite</text>
  <text class="s b e" x="780" y="62">Board, business owners</text>
  <rect class="ba" x="20" y="112" width="780" height="76" rx="5"/>
  <text class="cap" x="40" y="134">Spine · new</text>
  <text class="b ta" x="40" y="154">Is critical information reaching the right person in time?</text>
  <text class="s" x="40" y="174">time to decision-maker; misses; false alarms; off-list escalations; questions that never fire</text>
  <text class="s b e" x="780" y="154">Head of security, owners</text>
  <rect class="bx" x="20" y="204" width="780" height="76" rx="5"/>
  <text class="cap" x="40" y="226">Activity</text>
  <text class="b" x="40" y="246">Is each team doing its work well?</text>
  <text class="s" x="40" y="266">alerts handled; weaknesses fixed by their due date; monitoring coverage</text>
  <text class="s b e" x="780" y="246">Team leads</text>

</svg>
